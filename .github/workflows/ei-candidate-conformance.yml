name: EI npm prerelease host conformance

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "agent/event-intelligence.ts"
      - "agent/event-intelligence.conformance.test.ts"
      - "agent/event-intelligence-candidate.test.ts"
      - "agent/event-intelligence-process.test.ts"
      - "agent/fixtures/event-intelligence-process-worker.ts"
      - ".github/workflows/ei-candidate-conformance.yml"
      - "docs/evidence/ei-v1-fork-host-conformance.md"
      - "docs/evidence/ei-canonical-adapter-size-experiment.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  muffin-candidate-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout upstream-dev-based Muffin fork test branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Muffin's pinned dependencies without invoking its old prepare/compile
        run: npm ci --ignore-scripts

      - name: Verify actual npm prerelease pin, integrity and canonical API
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { fileURLToPath } from 'node:url';
          import { dirname, join } from 'node:path';
          import { createEventIntelligence } from 'mcp-event-intelligence/embedded';
           const declared=JSON.parse(readFileSync('package.json','utf8'));
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          // Resolve the actual ESM export, not an unsupported CJS require subpath.
          const pkgEntry=fileURLToPath(import.meta.resolve('mcp-event-intelligence/embedded'));
          const installed=JSON.parse(readFileSync(
            join(dirname(pkgEntry),'../package.json'),'utf8'));
          const version='0.12.0-next.0';
          assert.equal(declared.dependencies['mcp-event-intelligence'],version);
          assert.equal(lock.packages[''].dependencies['mcp-event-intelligence'],version);
          assert.equal(lock.packages['node_modules/mcp-event-intelligence'].version,version);
          assert.equal(installed.version,version);
          assert.equal(typeof createEventIntelligence,'function');
          console.log('EI real npm prerelease '+version+' installed and canonical API available');
          EOF
          # The reviewed lock must pin the exact SHA-512 digest from
          # the actual published npm tarball, not a source snapshot.
          REGISTRY_SRI="$(npm view mcp-event-intelligence@0.12.0-next.0 dist.integrity \
            --registry=https://registry.npmjs.org/)"
          LOCK_SRI="$(node -p "require('./package-lock.json').packages['node_modules/mcp-event-intelligence'].integrity")"
          test "$REGISTRY_SRI" = "$LOCK_SRI"
          test "${LOCK_SRI#sha512-}" != "$LOCK_SRI"
          git diff --exit-code -- package.json package-lock.json

      - name: Rebuild Muffin's native SQLite dependency (npm ci skipped prepare)
        run: npm rebuild better-sqlite3

      - name: Compile host against published npm candidate API
        run: npm run typecheck

      - name: Run Muffin EI tests and strict v3 against actual npm prerelease
        env:
          EI_CANDIDATE_CONFORMANCE: "1"
        run: |
          npx vitest run \
            agent/event-intelligence.test.ts \
            agent/event-intelligence.conformance.test.ts \
            agent/event-intelligence-candidate.test.ts \
            agent/event-intelligence-process.test.ts \
            agent/event-intelligence-authority.test.ts \
            agent/event-intelligence-discovery.test.ts \
            agent/event-intelligence-recovery.test.ts \
            agent/event-intelligence-restart.test.ts

      - name: Retain exact-host conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muffin-ei-v1-host-conformance
          path: ei-host-conformance-report.json
          if-no-files-found: warn
