name: EI spike

on:
  push:
    branches:
      - slice/event-intelligence-spike

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      # The spike intentionally does not touch the canonical lockfile until the
      # integration compiles and the E2E seam is proven.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run agent/event-intelligence.test.ts core/mcp/mcp.test.ts
